[package]
name = "alex-plugin-runtime-client"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Default PluginRuntimeClient implementation for Alex extension execution"

[lib]
name = "alex_plugin_runtime_client"
crate-type = ["rlib"]

[dependencies]
async-trait = { workspace = true }
alex-runtime-ports = { path = "../../contracts/runtime-ports", features = ["plugin-runtime"] }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
