[package]
name = "alex-agent-tools"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Alex agent tool contracts"

[lib]
name = "alex_agent_tools"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
alex-core-types = { path = "../../contracts/core-types" }
alex-runtime-ports = { path = "../../contracts/runtime-ports" }
async-trait = { workspace = true }
indexmap = { workspace = true }

[features]
default = []
acp-bridge = []
computer-use-contract = []
element-token = []
mcp-bridge = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
