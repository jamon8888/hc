[package]
name = "alex-agent-stream"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Lightweight agent stream processing for Alex"

[lib]
name = "alex_agent_stream"
crate-type = ["rlib"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
alex-events = { path = "../../contracts/events" }
alex-core-types = { path = "../../contracts/core-types" }
futures = { workspace = true }
alex-tool-call-jsonrepair = { path = "../tool-call-jsonrepair" }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
alex-agent-tools = { path = "../tool-contracts" }
tokio-stream = { workspace = true }

[lints]
workspace = true
