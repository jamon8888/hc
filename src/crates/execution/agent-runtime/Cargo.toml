[package]
name = "alex-agent-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Agent runtime contracts and owner decisions for Alex"
autotests = false

[lib]
name = "alex_agent_runtime"
crate-type = ["rlib"]

[[example]]
name = "sdk_minimal"
path = "examples/sdk_minimal.rs"
required-features = ["agent-runtime"]

[features]
default = []
definition-contracts = [
    "dep:alex-core-types",
    "dep:regex",
    "dep:serde",
    "dep:serde_yaml",
    "dep:thiserror",
]
native-hook-settings = ["dep:regex", "dep:serde_json"]
native-hook-runtime = [
    "native-hook-settings",
    "dep:async-trait",
    "dep:log",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:thiserror",
    "tokio/io-util",
    "tokio/macros",
    "tokio/process",
    "tokio/rt",
    "tokio/time",
]
agent-runtime = [
    "definition-contracts",
    "native-hook-runtime",
    "dep:async-trait",
    "dep:alex-agent-stream",
    "dep:alex-agent-tools",
    "dep:alex-core-types",
    "dep:alex-events",
    "dep:alex-runtime-ports",
    "dep:alex-runtime-services",
    "dep:dashmap",
    "dep:hex",
    "dep:log",
    "dep:regex",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:sha2",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-util",
    "dep:uuid",
    "tokio/macros",
    "tokio/rt",
    "tokio/sync",
]

[dependencies]
async-trait = { workspace = true, optional = true }
alex-agent-stream = { path = "../agent-stream", optional = true }
alex-agent-tools = { path = "../tool-contracts", optional = true }
alex-core-types = { path = "../../contracts/core-types", optional = true }
alex-events = { path = "../../contracts/events", optional = true }
alex-runtime-ports = { path = "../../contracts/runtime-ports", optional = true, features = ["agent-api", "git-port", "permission", "plugin-runtime", "remote-workspace-ports", "runtime-event-port", "terminal-port", "workspace-ports"] }
alex-runtime-services = { path = "../runtime-services", optional = true }
dashmap = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
log = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[[test]]
name = "agent_definition_contracts"
path = "tests/agent_definition_contracts.rs"
required-features = ["agent-runtime"]

[[test]]
name = "agent_session_contracts"
path = "tests/agent_session_contracts.rs"
required-features = ["agent-runtime"]

[[test]]
name = "agent_interaction_contracts"
path = "tests/agent_interaction_contracts.rs"
required-features = ["agent-runtime"]

[[test]]
name = "agent_long_horizon_contracts"
path = "tests/agent_long_horizon_contracts.rs"
required-features = ["agent-runtime"]

[[test]]
name = "native_hook_execution_contracts"
path = "tests/native_hook_execution_contracts.rs"
required-features = ["native-hook-runtime"]

[[test]]
name = "native_hook_settings_contracts"
path = "tests/native_hook_settings_contracts.rs"
required-features = ["native-hook-settings"]

[lints]
workspace = true
