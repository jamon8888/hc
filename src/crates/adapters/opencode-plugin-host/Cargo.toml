[package]
name = "alex-opencode-plugin-host"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish = false
description = "Private OpenCode plugin host process and IPC adapter"

[lib]
name = "alex_opencode_plugin_host"
crate-type = ["rlib"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
alex-services-core = { path = "../../services/services-core", features = ["process-runtime"] }
alex-runtime-ports = { path = "../../contracts/runtime-ports", features = ["hook-function-runtime"] }
log = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
url = { workspace = true }
urlencoding = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
