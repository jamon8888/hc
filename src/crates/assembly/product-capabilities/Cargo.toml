[package]
name = "alex-product-capabilities"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Alex product capability pack contracts"
autotests = false

[lib]
name = "alex_product_capabilities"
crate-type = ["rlib"]

[[test]]
name = "product_capability_contracts"
path = "tests/product_capability_contracts.rs"

[features]
default = []
# Compile-time switch for the Basemind tool owner. Mirrors and enables the
# basemind cfg of alex-tool-packs so the deliberate ImageAnalysis removal
# and the tool request engage together in every build graph.
basemind = ["alex-tool-packs/basemind"]

[dependencies]
alex-runtime-ports = { path = "../../contracts/runtime-ports", features = ["plugin-runtime"] }
alex-runtime-services = { path = "../../execution/runtime-services" }
alex-tool-packs = { path = "../../execution/tool-provider-groups" }

[dev-dependencies]
async-trait = { workspace = true }
alex-agent-runtime = { path = "../../execution/agent-runtime", features = ["agent-runtime"] }
alex-runtime-ports = { path = "../../contracts/runtime-ports", features = ["agent-api"] }
alex-runtime-services = { path = "../../execution/runtime-services", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
