[package]
name = "openbitfun_basemind_integration"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Basemind integration for OpenBitFun - document extraction, redaction, RAG, and prompt pseudonymization"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jamon8888/OpenBitFun"

[features]
default = []
basemind = [
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:anyhow",
    "dep:url",
    "dep:async-trait",
    "dep:tracing",
    "dep:thiserror",
    "dep:aes-gcm",
    "dep:rand",
    "dep:sha2",
    "dep:tokio-util",
    "dep:openbitfun-runtime-ports",
    "dep:openbitfun-services-core",
    "dep:tool-runtime",
]
tools-rag = ["basemind"]
document-read = ["basemind", "tool-runtime/document-read"]

[dependencies]
tokio = { version = "1", features = ["full"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
anyhow = { version = "1", optional = true }
url = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
tokio-util = { version = "0.7", optional = true }

# Basemind-specific dependencies (crate names with hyphens)
async-trait = { version = "0.1", optional = true }
tracing = { version = "0.1", optional = true }
thiserror = { version = "1", optional = true }
aes-gcm = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }

# Workspace dependencies (inherited from root)
openbitfun-runtime-ports = { path = "../../contracts/runtime-ports", optional = true }
openbitfun-services-core = { path = "../../services/services-core", optional = true, features = ["workspace-runtime"] }

# tool_runtime is from execution/tool-execution
tool-runtime = { path = "../../execution/tool-execution", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"