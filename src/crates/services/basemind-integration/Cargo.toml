[package]
name = "openbitfun-basemind-integration"
version = "0.1.0"
edition = "2024"
description = "Basemind integration: PII detection, redaction, RAG, identity registry, vault"
license = "Apache-2.0"
categories = ["integration", "security", "privacy"]

[features]
default = ["basemind"]
basemind = ["dep:anyhow", "dep:async-trait", "dep:base64", "dep:chrono", "dep:dashmap", "dep:hex", "dep:hmac", "dep:log", "dep:md5", "dep:regex", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:tokio", "dep:tracing", "dep:uuid", "dep:reqwest", "dep:aes-gcm", "dep:scrypt", "dep:rand", "dep:sha2", "dep:url", "dep:openbitfun-runtime-ports", "dep:openbitfun-services-core", "dep:security-framework", "dep:security-framework-sys", "dep:windows", "dep:secret-service", "dep:keyring-core", "dep:windows-native-keyring-store", "dep:zbus-secret-service-keyring-store"]
tools-rag = ["basemind"]
document-read = ["basemind"]
pseudonymization = ["basemind"]

[dependencies]
# Workspace deps
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
log = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time"] }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
url = { workspace = true, optional = true }

# Runtime ports: workspace filesystem port (workspace_fs) + the RagSearchPort
# seam implemented over RagSearchTool (D11).
openbitfun-runtime-ports = { path = "../../contracts/runtime-ports", optional = true, features = ["workspace-ports", "rag-search", "document-redaction", "prompt-pseudonymization"] }

# MCP HTTP client - raw reqwest, no rmcp client dependency.
# Loopback plain HTTP only; workspace reqwest keeps default features (and TLS) off.
reqwest = { workspace = true, optional = true, features = ["json"] }

# On-demand daemon spawn — the fork self-terminates an abandoned daemon, so
# the first call after that has to bring it back. process-managed spawn is a
# shared capability, not this crate's to reimplement.
openbitfun-services-core = { path = "../services-core", optional = true, features = ["process-runtime"] }

# Vault crypto
aes-gcm = { version = "0.10", optional = true }
hmac = { workspace = true, optional = true }
scrypt = { version = "0.12", optional = true, features = ["kdf"] }
rand = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }

# Keychain integration — target-gated so each platform only builds its own
# store; the `basemind` feature forwards `dep:` for all three (a no-op for
# targets where the dependency is not declared).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "2.11", optional = true }
security-framework-sys = { version = "2.11", optional = true }
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.60", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_DataExchange"], optional = true }
windows-native-keyring-store = { workspace = true, optional = true }
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", optional = true }
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { workspace = true, optional = true }
# The credential store the product already uses off macOS: the Windows
# Credential Manager and the Linux Secret Service, through `keyring-core`.
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring-core = { workspace = true, optional = true }

[dev-dependencies]
tokio-test = "0.4"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "client_contract"
required-features = ["basemind"]

[[test]]
name = "live_daemon"
required-features = ["basemind"]