[package]
name = "alex-acp"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Alex Agent Client Protocol surface"

[features]
default = ["client", "server"]
client = [
    "alex-agent-tools/acp-bridge",
    "dep:futures",
    "dep:serde",
    "dep:dirs",
    "dep:semver",
    "dep:tar",
    "dep:alex-core",
    "alex-core/agent-runtime",
    "alex-core/ssh-remote",
]
server = [
    "dep:alex-agent-tools",
    "dep:alex-agent-runtime",
    "alex-agent-runtime/agent-runtime",
    "dep:alex-core-types",
    "dep:alex-core",
    "dep:sha2",
    "alex-core/agent-runtime",
    "alex-core/document-read",
    "alex-core/subscription-auth",
    "alex-core/external-sources",
    "alex-core/tools-basic",
    "alex-core/tools-git",
    "alex-core/tools-mcp",
    "alex-core/tools-browser-web",
    "alex-core/tools-computer-use",
    "alex-core/tools-image-analysis",
    "alex-core/tools-agent-control",
]

[lib]
name = "alex_acp"

[dependencies]
alex-core = { path = "../../assembly/core", optional = true }
alex-agent-runtime = { path = "../../execution/agent-runtime", optional = true }
alex-agent-tools = { path = "../../execution/tool-contracts", optional = true }
alex-events = { path = "../../contracts/events" }
alex-core-types = { path = "../../contracts/core-types", optional = true }

agent-client-protocol = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
futures = { workspace = true, optional = true }
async-trait = { workspace = true }
serde = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
serde_json = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
