name: Upstream Sync Validation

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream branch to sync from'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - gcwing/dev
      strategy:
        description: 'Sync strategy'
        required: true
        default: 'test-merge'
        type: choice
        options:
          - test-merge      # Test merge only (no push)
          - test-rebase     # Test rebase on temp branch
          - open-pr         # Open PR with merge commit

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-sync:
    name: Validate Upstream Sync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Scheduled runs carry no inputs, so the dispatch defaults must be
      # applied here. Every step reads these variables instead of
      # github.event.inputs; previously the empty input rendered as the
      # invalid ref "upstream/..HEAD" and failed the first git log.
      UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'main' }}
      STRATEGY: ${{ github.event.inputs.strategy || 'test-merge' }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/GCWing/OpenBitFun.git
          git fetch upstream --tags --prune

      - name: Show divergence
        id: divergence
        run: |
          echo "=== Local commits not in upstream ==="
          local_ahead=$(git log --oneline "upstream/${UPSTREAM_BRANCH}..HEAD" | wc -l)
          echo "$local_ahead"
          echo "=== Upstream commits not in local ==="
          upstream_ahead=$(git log --oneline "HEAD..upstream/${UPSTREAM_BRANCH}" | wc -l)
          echo "$upstream_ahead"
          echo "=== Diff stat ==="
          git diff --stat "HEAD..upstream/${UPSTREAM_BRANCH}"
          {
            echo "local_ahead=$local_ahead"
            echo "upstream_ahead=$upstream_ahead"
          } >> "$GITHUB_OUTPUT"

      - name: Test merge strategy
        if: env.STRATEGY == 'test-merge'
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git checkout -b test-merge-${{ github.run_id }}
          if git merge "upstream/${UPSTREAM_BRANCH}" --no-ff -m "chore: test merge upstream/${UPSTREAM_BRANCH}" 2>&1; then
            echo "Merge test passed - no conflicts"
          else
            echo "Merge has conflicts - analyzing..."
            echo "=== CONFLICTED FILES ==="
            git diff --name-only --diff-filter=U | head -100
            echo "=== CONFLICT SUMMARY ==="
            git diff --name-only --diff-filter=U | wc -l
            # Report-only by design: abort the conflicted merge so the
            # follow-up checkout does not fail on an unmerged index.
            git merge --abort 2>/dev/null || true
          fi
          git checkout main
          git branch -D test-merge-${{ github.run_id }} 2>/dev/null || true

      - name: Test rebase strategy
        if: env.STRATEGY == 'test-rebase'
        run: |
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          git checkout -b test-rebase-${{ github.run_id }}
          git config rerere.enabled true
          git config rerere.autoupdate true
          if git rebase "upstream/${UPSTREAM_BRANCH}" 2>&1 | tee rebase.log; then
            echo "Rebase clean - no conflicts"
          else
            echo "Rebase has conflicts:"
            grep -c "^CONFLICT" rebase.log || true
            echo "First 20 conflicts:"
            grep "^CONFLICT" rebase.log | head -20
          fi
          git rebase --abort 2>/dev/null || true
          git checkout main
          git branch -D test-rebase-${{ github.run_id }} 2>/dev/null || true

      - name: Run repo checks on merged state
        if: env.STRATEGY != 'open-pr'
        run: |
          # Skip checks if merge/rebase had conflicts (we're on main branch now)
          echo "=== Skipping build checks due to known massive divergence ==="
          echo "Run locally after manual conflict resolution:"
          echo "  pnpm install --frozen-lockfile"
          echo "  pnpm run check:repo-hygiene"
          echo "  pnpm run check:github-config"
          echo "  pnpm run check:core-boundaries"
          echo "  pnpm run fmt:rs -- --check"
          echo "  cargo check --workspace --locked"

      - name: Open PR with merge commit
        if: env.STRATEGY == 'open-pr'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync/upstream-${{ env.UPSTREAM_BRANCH }}-${{ github.run_id }}
          base: main
          title: 'chore: sync upstream/${{ env.UPSTREAM_BRANCH }} (${{ github.run_id }})'
          body: |
            Automated sync from upstream/${{ env.UPSTREAM_BRANCH }}.

            **Divergence:**
            - Local ahead: `${{ steps.divergence.outputs.local_ahead }}` commits
            - Upstream ahead: `${{ steps.divergence.outputs.upstream_ahead }}` commits

            **Strategy:** Merge commit (preserves both histories)

            **Review required:** Check for conflicts in:
            - Cargo.toml / Cargo.lock (workspace deps)
            - pnpm-lock.yaml
            - Config schemas
            - Breaking API changes in contracts/
          labels: |
            upstream-sync
            needs-review
          draft: true

  # Separate job to run the full build against the PR created above.
  build-test:
    name: Full Build Test
    needs: validate-sync
    # Job-level `if` cannot see the `env` context, so this deliberately keeps
    # github.event.inputs: scheduled runs have no inputs and stay skipped.
    if: github.event.inputs.strategy == 'open-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-sync.outputs.pr-branch }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node/pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            node_modules
            .pnpm-store
          key: ${{ runner.os }}-deps-${{ hashFiles('**/Cargo.lock', '**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run check:repo-hygiene
          pnpm run check:github-config
          pnpm run check:core-boundaries
          pnpm run fmt:rs -- --check
          cargo build --workspace --locked --release 2>&1 | tail -30
          pnpm run build:web-ui 2>&1 | tail -20
