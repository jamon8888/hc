name: CI

on:
  pull_request:
    paths-ignore:
      - 'png/**'
  push:
    branches: [main, 1.0.0-explore]
    paths-ignore:
      - 'png/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Build impact: fast checks plus the smallest useful package set ──
  build-impact:
    name: Build Impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_required: ${{ steps.classify.outputs.rust_required }}
      frontend_required: ${{ steps.classify.outputs.frontend_required }}
      desktop_packages_impacted: ${{ steps.classify.outputs.desktop_packages_impacted }}
      desktop_platforms: ${{ steps.classify.outputs.desktop_platforms }}
      linux_binaries_required: ${{ steps.classify.outputs.linux_binaries_required }}
      relay_image_required: ${{ steps.classify.outputs.relay_image_required }}
      dsh_profile_required: ${{ steps.classify.outputs.dsh_profile_required }}
      pr_producer_required: ${{ steps.classify.outputs.pr_producer_required }}
      reason: ${{ steps.classify.outputs.reason }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Classify build impact
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RANGE_MODE: ${{ github.event_name == 'pull_request' && 'merge-base' || 'direct' }}
        run: node scripts/ci/classify-build-impact.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --range-mode "$RANGE_MODE"

  # ── Shell deploy assets: LF endings + syntax ───────────────────────
  shell-scripts:
    name: Shell Deploy Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Reject CRLF in shell and deploy assets
        run: |
          bad=$(git ls-files -z \
                  '*.sh' '*.bash' 'Dockerfile' 'Dockerfile.*' '*.Dockerfile' 'Caddyfile' \
                  'docker-compose.yml' 'docker-compose.*.yml' \
                | xargs -0 -r grep -lU $'\r' || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF line endings found; these must stay LF (see .gitattributes):"
            echo "$bad"
            exit 1
          fi
          echo "All shell and deploy assets are LF-only."
      - name: bash -n every tracked shell script
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; rc=1; }
          done < <(git ls-files -z '*.sh' '*.bash')
          exit "$rc"
      - name: Verify release and version-generation contracts
        run: node --test scripts/release-channel.test.mjs scripts/tauri-release-manifest.test.mjs scripts/linux-binaries-manifest.test.mjs scripts/version-generation.test.mjs
      - name: Validate Relay deployment and packaging contracts
        run: node --test scripts/relay/*.test.mjs
      - name: Verify minisign download fallback
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/stubs"
          printf '#!/usr/bin/env bash\nexit 1\n' >"$test_root/stubs/sudo"
          chmod +x "$test_root/stubs/sudo"
          PATH="$test_root/stubs:/usr/bin:/bin" \
            RUNNER_TEMP="$test_root" \
            ALEX_SIGNING_KEY="YQ==" \
            bash scripts/sign-release-assets.sh "$test_root/missing-asset"
          "$test_root/alex-minisign-0.12/bin/minisign" -v

  # ═══════════════════════════════════════════════════════════════════════
  # PR FAST TRACK: Lightweight checks on GitHub runners (runs on ALL PRs)
  # ═══════════════════════════════════════════════════════════════════════

  # ── CLI: fast tests ─────────────────────────────────────────────────
  cli-test:
    name: CLI Tests (${{ matrix.os }})
    needs: build-impact
    if: ${{ !cancelled() && needs.build-impact.outputs.rust_required != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cache_key: ubuntu
          - os: macos-15
            cache_key: macos
          - os: windows-latest
            cache_key: windows
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "cli-ci-v3-${{ github.base_ref || github.ref_name }}-${{ matrix.cache_key }}"
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.0.0-explore') }}
          cache-on-failure: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.0.0-explore') }}
      - name: Run CLI and ACP tests on macOS
        if: runner.os == 'macOS'
        run: cargo test --locked -p alex-cli -p alex-acp
      - name: Run CLI, ACP, and agent runtime tests
        if: runner.os == 'Linux'
        run: cargo test --locked -p alex-cli -p alex-acp -p alex-agent-runtime
      - name: Run Windows CLI terminal contracts
        if: runner.os == 'Windows'
        run: cargo test --locked -p alex-cli --test terminal_process_contracts -- --test-threads=1
      - name: Run SDK Host tests
        if: runner.os == 'Linux'
        run: cargo test --locked -p alex-sdk-host -p alex-sdk-host-app
      - name: Run SDK Host terminal cleanup regressions
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p terminal-core shutdown_returns_only_after_process_exit_is_confirmed -- --test-threads=1
          cargo test --locked -p terminal-core shutdown_evicts_a_process_whose_controller_already_confirmed_exit -- --test-threads=1
          cargo test --locked -p terminal-core background_only_binding_is_owned_by_the_session -- --test-threads=1

  # ── Rust: fast build check (no product-full) ────────────────────────
  rust-check:
    name: Rust Check (${{ matrix.os }})
    needs: build-impact
    if: ${{ !cancelled() && needs.build-impact.outputs.rust_required != 'false' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Create Tauri resource directories
        shell: bash
        run: |
          mkdir -p dist src/mobile-web/dist src/apps/extension-host/dist
          touch src/apps/extension-host/dist/extension-host.js
      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT_PKG=libwebkit2gtk-4.1-dev
          else
            WEBKIT_PKG=libwebkit2gtk-4.0-dev
          fi
          if apt-cache show libappindicator3-dev >/dev/null 2>&1; then
            APPINDICATOR_PKG=libappindicator3-dev
          else
            APPINDICATOR_PKG=libayatana-appindicator3-dev
          fi
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-pipewire \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libxdo-dev \
            "$WEBKIT_PKG" \
            "$APPINDICATOR_PKG" \
            librsvg2-dev \
            patchelf \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr \
            tesseract-ocr-eng
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ci-check-v6-${{ github.base_ref || github.ref_name }}-${{ runner.os }}-no-cargo-bin"
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.0.0-explore') }}
          cache-on-failure: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.0.0-explore') }}
      - name: Verify committed Cargo metadata
        run: cargo metadata --locked --no-deps
      - name: Check compilation
        timeout-minutes: 20
        run: cargo check --locked --workspace
      - name: Check installer compilation
        if: runner.os == 'Windows'
        run: cargo check --manifest-path Alex-Installer/src-tauri/Cargo.toml
      - name: Run core library tests (fast, no product-full)
        run: cargo test --locked -p alex-core --lib
      - name: Run desktop library tests
        if: runner.os != 'Windows'
        run: cargo test --locked -p alex-desktop --lib
      - name: Probe Windows desktop library tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testOutput = cargo test --locked -p alex-desktop --lib 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | ForEach-Object { Write-Output $_ }
          if ($testExitCode -eq 0) { exit 0 }
          $testLog = $testOutput | Out-String
          $knownTauriLoaderFailure = (
            $testLog -match 'process .*exit successfully:.*alex_desktop_lib-' -and
            $testLog -match 'exit code: 0xc0000139' -and
            $testLog -match 'STATUS_ENTRYPOINT_NOT_FOUND' -and
            $testLog -notmatch 'test result: FAILED'
          )
          if ($knownTauriLoaderFailure) {
            Write-Output '::warning title=Tauri Windows test-loader limitation::The desktop test harness hit upstream Tauri issue #13419 before any Rust test ran. Compilation and the cross-platform product-control contracts remain blocking.'
            exit 0
          }
          exit $testExitCode
      - name: Run product-control domain and delivery-profile contracts
        shell: bash
        run: |
          cargo test --locked -p alex-product-domains --no-default-features product_control
          cargo test --locked -p alex-product-domains --no-default-features remote_surface
          cargo test --locked -p alex-product-capabilities every_agent_runtime_delivery_profile_includes_product_control_discovery
      - name: Run Page Functions runtime tests
        run: cargo test --locked -p alex-page-function-runtime
      - name: Run Relay service tests
        run: cargo test --locked -p alex-relay-service
      - name: Run subscription authentication tests
        run: cargo test --locked -p alex-ai-adapters --features subscription-auth --lib subscription_auth
      - name: Run file watch contract tests
        run: cargo test --locked -p alex-services-integrations --no-default-features --features file-watch --test file_watch_contracts
      - name: Run process lifecycle contract tests
        shell: bash
        run: |
          cargo test --locked -p alex-services-core --no-default-features --features process-runtime --test process_runtime_contracts
          cargo test --locked -p alex-services-core --no-default-features --features process-runtime --lib process_tree::tests::
      - name: Run search tool tests
        run: "cargo test --locked -p tool-runtime --lib search::"
      - name: Run workspace provider contracts
        shell: bash
        run: |
          cargo test --locked -p alex-services-core --no-default-features --features workspace-runtime --lib workspace::tests::
          cargo test --locked -p alex-services-integrations --no-default-features --features remote-ssh-concrete --lib remote_ssh::manager::tests::workspace_
          cargo test --locked -p tool-runtime --no-default-features --lib fs::read_file::tests::
          cargo test --locked -p tool-runtime --no-default-features --test tool_io_contracts
      - name: Run workspace Agent contracts
        if: runner.os != 'Linux'
        run: >-
          cargo test --locked -p alex-core --no-default-features
          --features agent-runtime,git,remote-workspace,document-read --lib --
          file_read_tool::tests file_write_tool::tests file_edit_tool::tests
          delete_file_tool::tests grep_tool::tests glob_tool::tests ls_tool::tests
          tool_context_runtime::path_resolution_tests file_read_state_runtime::tests
          service::snapshot:: product_runtime::tests::session_fork_

  # ── Frontend: fast lint + type-check (no full build) ────────────────
  frontend-lint:
    name: Frontend Lint & Type-Check
    needs: build-impact
    if: ${{ !cancelled() && needs.build-impact.outputs.frontend_required != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check repository hygiene
        run: pnpm run check:repo-hygiene
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate interactive capability contract
        run: pnpm run capabilities:check && pnpm run capabilities:test && pnpm run website:test && pnpm run website:build
      - name: Test core boundary contracts
        run: pnpm run check:core-boundaries:test
      - name: Check core boundaries
        run: pnpm run check:core-boundaries
      - name: Validate GitHub config
        run: pnpm run check:github-config
      - name: Validate i18n contract
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run i18n:contract:test:ci
      - name: Audit i18n resources
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run i18n:audit
      - name: Validate theme color audit contract
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run theme:color-audit:test
      - name: Audit theme color governance
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run theme:color-audit:all
      - name: Validate theme visual governance contract
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run theme:visual-contract
      - name: Validate WebKit compatibility gate
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run verify:webkit-compatibility:test
      - name: Lint web UI
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run lint:web
      - name: Type-check web UI
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm --dir src/web-ui exec tsc --noEmit
      - name: Run web UI tests
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm --dir src/web-ui run test:run
      - name: Run MiniApp Market tests
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm --dir src/miniapp-market-web run test
      - name: Run Skin Market tests
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm --dir src/skin-market-web run test

  # ═══════════════════════════════════════════════════════════════════════
  # MAIN PUSH / SCHEDULED: Heavy jobs on self-hosted runners
  # ═══════════════════════════════════════════════════════════════════════

  # ── Rust: full product-full test suite on self-hosted ──────────────
  rust-full-test:
    name: Rust Full Test (product-full)
    needs: build-impact
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.0.0-explore') &&
      needs.build-impact.outputs.rust_required != 'false'
    runs-on: [self-hosted, linux, x64, large]
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Create Tauri resource directories
        shell: bash
        run: |
          mkdir -p dist src/mobile-web/dist src/apps/extension-host/dist
          touch src/apps/extension-host/dist/extension-host.js
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "ci-check-v6-${{ github.ref_name }}-linux-x64-no-cargo-bin"
          cache-bin: false
          save-if: true
          cache-on-failure: true
      - name: Verify committed Cargo metadata
        run: cargo metadata --locked --no-deps
      - name: Check compilation
        run: cargo check --locked --workspace
      - name: Run FULL core library tests with product-full
        timeout-minutes: 45
        run: cargo test --locked -p alex-core --features product-full --lib
      - name: Run desktop library tests
        run: cargo test --locked -p alex-desktop --lib
      - name: Run product-control domain and delivery-profile contracts
        shell: bash
        run: |
          cargo test --locked -p alex-product-domains --no-default-features product_control
          cargo test --locked -p alex-product-domains --no-default-features remote_surface
          cargo test --locked -p alex-product-capabilities every_agent_runtime_delivery_profile_includes_product_control_discovery
      - name: Run Page Functions runtime tests
        run: cargo test --locked -p alex-page-function-runtime
      - name: Run Relay service tests
        run: cargo test --locked -p alex-relay-service
      - name: Run subscription authentication tests
        run: cargo test --locked -p alex-ai-adapters --features subscription-auth --lib subscription_auth
      - name: Run file watch contract tests
        run: cargo test --locked -p alex-services-integrations --no-default-features --features file-watch --test file_watch_contracts
      - name: Run process lifecycle contract tests
        shell: bash
        run: |
          cargo test --locked -p alex-services-core --no-default-features --features process-runtime --test process_runtime_contracts
          cargo test --locked -p alex-services-core --no-default-features --features process-runtime --lib process_tree::tests::
      - name: Run search tool tests
        run: "cargo test --locked -p tool-runtime --lib search::"
      - name: Run workspace provider contracts
        shell: bash
        run: |
          cargo test --locked -p alex-services-core --no-default-features --features workspace-runtime --lib workspace::tests::
          cargo test --locked -p alex-services-integrations --no-default-features --features remote-ssh-concrete --lib remote_ssh::manager::tests::workspace_
          cargo test --locked -p tool-runtime --no-default-features --lib fs::read_file::tests::
          cargo test --locked -p tool-runtime --no-default-features --test tool_io_contracts
      - name: Run workspace Agent contracts
        run: >-
          cargo test --locked -p alex-core --no-default-features
          --features agent-runtime,git,remote-workspace,document-read --lib --
          file_read_tool::tests file_write_tool::tests file_edit_tool::tests
          delete_file_tool::tests grep_tool::tests glob_tool::tests ls_tool::tests
          tool_context_runtime::path_resolution_tests file_read_state_runtime::tests
          service::snapshot:: product_runtime::tests::session_fork_

  # ── Frontend: full build on self-hosted ───────────────────────────
  frontend-full-build:
    name: Frontend Full Build
    needs: build-impact
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.0.0-explore') &&
      needs.build-impact.outputs.frontend_required != 'false'
    runs-on: [self-hosted, linux, x64, large]
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=16384
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check repository hygiene
        run: pnpm run check:repo-hygiene
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate interactive capability contract
        run: pnpm run capabilities:check && pnpm run capabilities:test && pnpm run website:test && pnpm run website:build
      - name: Test core boundary contracts
        run: pnpm run check:core-boundaries:test
      - name: Check core boundaries
        run: pnpm run check:core-boundaries
      - name: Validate i18n contract
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run i18n:contract:test:ci
      - name: Audit i18n resources
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run i18n:audit
      - name: Validate theme color audit contract
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run theme:color-audit:test
      - name: Audit theme color governance
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run theme:color-audit:all
      - name: Validate theme visual governance contract
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run theme:visual-contract
      - name: Validate WebKit compatibility gate
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run verify:webkit-compatibility:test
      - name: Lint web UI
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run lint:web
      - name: Run web UI tests
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm --dir src/web-ui run test:run
      - name: Build web UI (sequential tsc + vite to avoid OOM)
        if: needs.build-impact.outputs.frontend_required != 'false'
        timeout-minutes: 30
        run: CI=true pnpm run build:web
      - name: Type-check mobile web
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm --dir src/mobile-web run type-check
      - name: Build mobile web
        if: needs.build-impact.outputs.frontend_required != 'false'
        run: pnpm run build:mobile-web

  # ═══════════════════════════════════════════════════════════════════════
  # Existing jobs that remain unchanged
  # ═══════════════════════════════════════════════════════════════════════

  # ── Shell deploy assets: LF endings + syntax ───────────────────────
  shell-scripts:
    name: Shell Deploy Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Reject CRLF in shell and deploy assets
        run: |
          bad=$(git ls-files -z \
                  '*.sh' '*.bash' 'Dockerfile' 'Dockerfile.*' '*.Dockerfile' 'Caddyfile' \
                  'docker-compose.yml' 'docker-compose.*.yml' \
                | xargs -0 -r grep -lU $'\r' || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF line endings found; these must stay LF (see .gitattributes):"
            echo "$bad"
            exit 1
          fi
          echo "All shell and deploy assets are LF-only."
      - name: bash -n every tracked shell script
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::bash syntax error"; rc=1; }
          done < <(git ls-files -z '*.sh' '*.bash')
          exit "$rc"
      - name: Verify release and version-generation contracts
        run: node --test scripts/release-channel.test.mjs scripts/tauri-release-manifest.test.mjs scripts/linux-binaries-manifest.test.mjs scripts/version-generation.test.mjs
      - name: Validate Relay deployment and packaging contracts
        run: node --test scripts/relay/*.test.mjs
      - name: Verify minisign download fallback
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT
          mkdir -p "$test_root/stubs"
          printf '#!/usr/bin/env bash\nexit 1\n' >"$test_root/stubs/sudo"
          chmod +x "$test_root/stubs/sudo"
          PATH="$test_root/stubs:/usr/bin:/bin" \
            RUNNER_TEMP="$test_root" \
            ALEX_SIGNING_KEY="YQ==" \
            bash scripts/sign-release-assets.sh "$test_root/missing-asset"
          "$test_root/alex-minisign-0.12/bin/minisign" -v

  # ── Impact-selected Linux binaries (existing, unchanged) ───────────
  package-impact-contract:
    name: Impact-selected Linux / Relay Contract
    needs: build-impact
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.build-impact.result == 'success' &&
      needs.build-impact.outputs.pr_producer_required == 'true'
    uses: ./.github/workflows/linux-binaries.yml
    permissions:
      contents: read
    with:
      checkout_ref: ${{ github.sha }}
      version: 1.0.0-nightly.ci.${{ github.run_id }}
      artifact_prefix: ci-${{ github.run_id }}
      artifact_retention_days: 1
      validate_relay_image: ${{ needs.build-impact.outputs.relay_image_required == 'true' }}
      upload_artifacts: false
      cache_write: false

  # ── DSH Profile Packaging on Windows (existing, unchanged) ─────────
  dsh-profile-windows:
    name: DSH Profile Packaging (windows-latest)
    needs: build-impact
    if: ${{ !cancelled() && needs.build-impact.outputs.dsh_profile_required == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Build the bridge profile
        run: node scripts/prepare-dsh-profile.mjs
      - name: Verify the profile is complete and stamped
        shell: bash
        run: |
          set -euo pipefail
          root=packages/dsh-acp/dist-profile
          for path in \
            "$root/.alex-bridge.json" \
            "$root/cordis.patch.yml" \
            "$root/package.json" \
            "$root/lib/app.js" \
            "$root/node_modules/@agentclientprotocol/sdk/package.json" \
            "$root/node_modules/@deepseek-ai/dsh-agent-spine-demo/package.json"
          do
            [ -f "$path" ] || { echo "::error::missing $path"; exit 1; }
          done
          nested=$(find "$root/lib" "$root/presets" -name node_modules -o -name '*.map' || true)
          if [ -n "$nested" ]; then
            echo "::error::profile carries files it must not ship:"
            echo "$nested"
            exit 1
          fi
          node -e '
            const stamp = require("./packages/dsh-acp/dist-profile/.alex-bridge.json");
            if (stamp.profile !== "alex-acp") throw new Error("wrong profile name: " + stamp.profile);
            if (!/^[0-9a-f]{64}$/.test(stamp.content)) throw new Error("no content digest");
            process.stdout.write(`profile ${stamp.profile} @ ${stamp.bridge}, min dsh ${stamp.minDshVersion}\n`);
          '

  # ── Final validation (unchanged) ──────────────────────────────────
  rust-validation-result:
    name: Rust / CLI Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [build-impact, cli-test, rust-check, package-impact-contract]
    steps:
      - name: Verify Rust and CLI result
        shell: pwsh
        env:
          RUST_REQUIRED: ${{ needs.build-impact.outputs.rust_required }}
          PR_PRODUCER_REQUIRED: ${{ needs.build-impact.outputs.pr_producer_required }}
          EVENT_NAME: ${{ github.event_name }}
          IMPACT_RESULT: ${{ needs.build-impact.result }}
          CLI_RESULT: ${{ needs.cli-test.result }}
          RUST_RESULT: ${{ needs.rust-check.result }}
          BUILD_RESULT: ${{ needs.package-impact-contract.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:IMPACT_RESULT -ne 'success') {
            throw "Build impact classification did not succeed: $env:IMPACT_RESULT"
          }
          switch ($env:RUST_REQUIRED) {
            'false' {
              if ($env:CLI_RESULT -ne 'skipped' -or $env:RUST_RESULT -ne 'skipped') {
                throw "Expected skipped Rust/CLI jobs; CLI=$env:CLI_RESULT Rust=$env:RUST_RESULT"
              }
            }
            'true' {
              if ($env:CLI_RESULT -ne 'success' -or $env:RUST_RESULT -ne 'success') {
                throw "Expected successful Rust and CLI jobs; CLI=$env:CLI_RESULT Rust=$env:RUST_RESULT"
              }
            }
            default {
              throw "Unexpected rust_required value: '$env:RUST_REQUIRED'"
            }
          }
          $producerExpected = $env:EVENT_NAME -eq 'pull_request' -and $env:PR_PRODUCER_REQUIRED -eq 'true'
          if ($producerExpected -and $env:BUILD_RESULT -ne 'success') {
            throw "Expected successful impact-selected producer jobs; Build=$env:BUILD_RESULT"
          }
          if (-not $producerExpected -and $env:BUILD_RESULT -ne 'skipped') {
            throw "Expected producer jobs to be skipped; Build=$env:BUILD_RESULT"
          }

